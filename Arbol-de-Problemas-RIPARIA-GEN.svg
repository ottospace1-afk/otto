<line x1="652.0" y1="537.0" x2="652.0" y2="729.0" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="557.0" width="300.0" height="63.0" rx="7" ry="7" fill="#f5f9f3" stroke="#8aa983" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#36502f"><tspan x="804.0" y="573.5">Escasez de vegetación de ribera</tspan><tspan x="804.0" y="588.5">(herbácea e higrófila) de la que se</tspan><tspan x="804.0" y="603.5">alimenta y en la que se refugia</tspan></text>
<line x1="652.0" y1="588.5" x2="654.0" y2="588.5" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="631.0" width="300.0" height="63.0" rx="7" ry="7" fill="#f5f9f3" stroke="#8aa983" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#36502f"><tspan x="804.0" y="647.5">Orillas rocosas o endurecidas, de</tspan><tspan x="804.0" y="662.5">difícil excavación, que impiden</tspan><tspan x="804.0" y="677.5">construir las madrigueras</tspan></text>
<line x1="652.0" y1="662.5" x2="654.0" y2="662.5" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="705.0" width="300.0" height="48.0" rx="7" ry="7" fill="#f5f9f3" stroke="#8aa983" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#36502f"><tspan x="804.0" y="721.5">Fragmentación y pérdida de continuidad</tspan><tspan x="804.0" y="736.5">del hábitat a lo largo del cauce</tspan></text>
<line x1="652.0" y1="729.0" x2="654.0" y2="729.0" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1130.0" y="467.5" width="300.0" height="69.5" rx="7" ry="7" fill="#e8f0e4" stroke="#3f6b38" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2b5126"><tspan x="1280.0" y="485.8">Insuficiente seguimiento y</tspan><tspan x="1280.0" y="502.2">conocimiento del estado</tspan><tspan x="1280.0" y="518.8">poblacional</tspan></text>
<line x1="1142.0" y1="537.0" x2="1142.0" y2="596.0" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1144.0" y="557.0" width="300.0" height="78.0" rx="7" ry="7" fill="#f5f9f3" stroke="#8aa983" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#36502f"><tspan x="1294.0" y="573.5">Escasez de censos y estudios</tspan><tspan x="1294.0" y="588.5">actualizados: se desconoce su</tspan><tspan x="1294.0" y="603.5">distribución real y su tendencia</tspan><tspan x="1294.0" y="618.5">poblacional</tspan></text>
