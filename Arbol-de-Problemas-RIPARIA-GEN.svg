<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a4d2c"><tspan x="314.0" y="166.5">Extinción local y desaparición de la</tspan><tspan x="314.0" y="181.5">rata de agua en el río Francia</tspan></text>
<line x1="162.0" y1="174.0" x2="164.0" y2="174.0" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
