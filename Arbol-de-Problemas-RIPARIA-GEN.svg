<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8a4a23"><tspan x="790.0" y="244.5">Pérdida de variabilidad genética y</tspan><tspan x="790.0" y="261.0">aislamiento poblacional</tspan></text>
<line x1="652.0" y1="218.0" x2="652.0" y2="107.5" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="76.0" width="300.0" height="63.0" rx="7" ry="7" fill="#fcf2ea" stroke="#d2a37c" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a4d2c"><tspan x="804.0" y="92.5">Menor intercambio genético y mayor</tspan><tspan x="804.0" y="107.5">riesgo de endogamia en poblaciones</tspan><tspan x="804.0" y="122.5">pequeñas y aisladas</tspan></text>
<line x1="652.0" y1="107.5" x2="654.0" y2="107.5" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="150.0" width="300.0" height="48.0" rx="7" ry="7" fill="#fcf2ea" stroke="#d2a37c" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a4d2c"><tspan x="804.0" y="166.5">Menor capacidad potencial de adaptación</tspan><tspan x="804.0" y="181.5">a los cambios ambientales</tspan></text>
<line x1="652.0" y1="174.0" x2="654.0" y2="174.0" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
