<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8a4a23"><tspan x="300.0" y="236.2">Reducción progresiva del número de</tspan><tspan x="300.0" y="252.8">individuos y de las poblaciones</tspan><tspan x="300.0" y="269.2">reproductoras</tspan></text>
