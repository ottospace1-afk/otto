<line x1="1142.0" y1="218.0" x2="1142.0" y2="174.0" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1144.0" y="150.0" width="300.0" height="48.0" rx="7" ry="7" fill="#fcf2ea" stroke="#d2a37c" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#7a4d2c"><tspan x="1294.0" y="166.5">Reducción de una presa para depredadores</tspan><tspan x="1294.0" y="181.5">autóctonos como la nutria y el turón</tspan></text>
<line x1="1142.0" y1="174.0" x2="1144.0" y2="174.0" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="520.0" y="331.5" width="480.0" height="92.0" rx="11" ry="11" fill="#123f3c" stroke="#123f3c" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff"><tspan x="760.0" y="355.5">Declive poblacional y riesgo de extinción</tspan><tspan x="760.0" y="377.5">local de la rata de agua (Arvicola sapidus)</tspan><tspan x="760.0" y="399.5">en el río Francia</tspan></text>
<text x="760" y="323.5" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#123f3c">PROBLEMA  FOCAL</text>
<rect x="150.0" y="467.5" width="300.0" height="69.5" rx="7" ry="7" fill="#e8f0e4" stroke="#3f6b38" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2b5126"><tspan x="300.0" y="494.0">Depredación por el visón americano</tspan><tspan x="300.0" y="510.5">(Neogale vison)</tspan></text>
<line x1="162.0" y1="537.0" x2="162.0" y2="655.0" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="164.0" y="557.0" width="300.0" height="63.0" rx="7" ry="7" fill="#f5f9f3" stroke="#8aa983" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#36502f"><tspan x="314.0" y="573.5">Presencia y expansión de una especie</tspan><tspan x="314.0" y="588.5">exótica invasora con capacidad</tspan><tspan x="314.0" y="603.5">depredadora sobre la fauna autóctona</tspan></text>
<line x1="162.0" y1="588.5" x2="164.0" y2="588.5" stroke="#9aa2a0" stroke-width="1.5" stroke-linecap="round"/>
<rect x="164.0" y="631.0" width="300.0" height="48.0" rx="7" ry="7" fill="#f5f9f3" stroke="#8aa983" stroke-width="1.6"/>
