<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="314.0" y="148.5">Contener y erradicar la especie exótica</tspan><tspan x="314.0" y="163.5">invasora mediante trampeo selectivo</tspan></text>
<line x1="162.0" y1="156.0" x2="164.0" y2="156.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="164.0" y="191.0" width="300.0" height="63.0" rx="7" ry="7" fill="#edf7f9" stroke="#83bcc4" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="314.0" y="207.5">Establecer un control y seguimiento</tspan><tspan x="314.0" y="222.5">continuo de las poblaciones de visón</tspan><tspan x="314.0" y="237.5">americano</tspan></text>
<line x1="162.0" y1="222.5" x2="164.0" y2="222.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="164.0" y="265.0" width="300.0" height="63.0" rx="7" ry="7" fill="#edf7f9" stroke="#83bcc4" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="314.0" y="281.5">Reducir la vulnerabilidad de las</tspan><tspan x="314.0" y="296.5">poblaciones locales de rata de agua</tspan><tspan x="314.0" y="311.5">frente a la depredación</tspan></text>
<line x1="162.0" y1="296.5" x2="164.0" y2="296.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
