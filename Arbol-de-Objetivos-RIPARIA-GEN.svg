<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="804.0" y="296.5">Mejorar la calidad del agua y el caudal</tspan><tspan x="804.0" y="311.5">del río</tspan></text>
<line x1="652.0" y1="304.0" x2="654.0" y2="304.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
