<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#115c67"><tspan x="790.0" y="374.5">Restaurar y reconectar el hábitat</tspan><tspan x="790.0" y="391.0">ribereño</tspan></text>
<line x1="652.0" y1="348.0" x2="652.0" y2="112.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
