<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="804.0" y="104.5">Recuperar la vegetación helofítica y</tspan><tspan x="804.0" y="119.5">herbácea que ofrece refugio y alimento</tspan></text>
<line x1="652.0" y1="112.0" x2="654.0" y2="112.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
