<text x="760" y="453.5" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#0f5560">OBJETIVO  CENTRAL · ¿QUÉ QUEREMOS CONSEGUIR?</text>
