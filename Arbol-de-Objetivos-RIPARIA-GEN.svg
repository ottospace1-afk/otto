<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#246b50"><tspan x="804.0" y="821.5">Mantener la capacidad de adaptación a</tspan><tspan x="804.0" y="836.5">los cambios ambientales</tspan></text>
<line x1="652.0" y1="829.0" x2="654.0" y2="829.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1130.0" y="597.5" width="300.0" height="69.5" rx="7" ry="7" fill="#dcefe4" stroke="#2f8a66" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#19624a"><tspan x="1280.0" y="615.8">Preservar las relaciones</tspan><tspan x="1280.0" y="632.2">ecológicas y la funcionalidad del</tspan><tspan x="1280.0" y="648.8">ecosistema ribereño</tspan></text>
<line x1="1142.0" y1="667.0" x2="1142.0" y2="770.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1144.0" y="687.0" width="300.0" height="48.0" rx="7" ry="7" fill="#eef8f2" stroke="#83bfa2" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#246b50"><tspan x="1294.0" y="703.5">Asegurar la disponibilidad de presa para</tspan><tspan x="1294.0" y="718.5">depredadores autóctonos (nutria y turón)</tspan></text>
<line x1="1142.0" y1="711.0" x2="1144.0" y2="711.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1144.0" y="746.0" width="300.0" height="48.0" rx="7" ry="7" fill="#eef8f2" stroke="#83bfa2" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#246b50"><tspan x="1294.0" y="762.5">Conservar la especie ingeniera que</tspan><tspan x="1294.0" y="777.5">estructura las orillas</tspan></text>
<line x1="1142.0" y1="770.0" x2="1144.0" y2="770.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
