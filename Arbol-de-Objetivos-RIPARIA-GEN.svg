<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#246b50"><tspan x="804.0" y="762.5">Reducir el riesgo de endogamia en las</tspan><tspan x="804.0" y="777.5">poblaciones pequeñas</tspan></text>
