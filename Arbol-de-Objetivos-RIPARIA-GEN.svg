<line x1="1280.0" y1="531.5" x2="1280.0" y2="553.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="150.0" y="304.0" width="300.0" height="69.5" rx="7" ry="7" fill="#d7edf0" stroke="#2b8793" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#115c67"><tspan x="300.0" y="322.2">Controlar el visón americano</tspan><tspan x="300.0" y="338.8">(Neogale vison) y reducir la</tspan><tspan x="300.0" y="355.2">presión de depredación</tspan></text>
<line x1="162.0" y1="304.0" x2="162.0" y2="186.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="164.0" y="162.0" width="300.0" height="48.0" rx="7" ry="7" fill="#edf7f9" stroke="#83bcc4" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="314.0" y="178.5">Contener y erradicar la especie exótica</tspan><tspan x="314.0" y="193.5">invasora mediante trampeo selectivo</tspan></text>
<line x1="162.0" y1="186.0" x2="164.0" y2="186.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="164.0" y="221.0" width="300.0" height="63.0" rx="7" ry="7" fill="#edf7f9" stroke="#83bcc4" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="314.0" y="237.5">Establecer un control y seguimiento</tspan><tspan x="314.0" y="252.5">continuo de las poblaciones de visón</tspan><tspan x="314.0" y="267.5">americano</tspan></text>
<line x1="162.0" y1="252.5" x2="164.0" y2="252.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="640.0" y="304.0" width="300.0" height="69.5" rx="7" ry="7" fill="#d7edf0" stroke="#2b8793" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#115c67"><tspan x="790.0" y="330.5">Restaurar y reconectar el hábitat</tspan><tspan x="790.0" y="347.0">ribereño</tspan></text>
<line x1="652.0" y1="304.0" x2="652.0" y2="119.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="88.0" width="300.0" height="63.0" rx="7" ry="7" fill="#edf7f9" stroke="#83bcc4" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="804.0" y="104.5">Recuperar la vegetación de ribera</tspan><tspan x="804.0" y="119.5">herbácea e higrófila de la que se</tspan><tspan x="804.0" y="134.5">alimenta y en la que se refugia</tspan></text>
<line x1="652.0" y1="119.5" x2="654.0" y2="119.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="162.0" width="300.0" height="48.0" rx="7" ry="7" fill="#edf7f9" stroke="#83bcc4" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="804.0" y="178.5">Restaurar las orillas y generar zonas</tspan><tspan x="804.0" y="193.5">adecuadas para construir madrigueras</tspan></text>
<line x1="652.0" y1="186.0" x2="654.0" y2="186.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="221.0" width="300.0" height="63.0" rx="7" ry="7" fill="#edf7f9" stroke="#83bcc4" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="804.0" y="237.5">Reconectar los tramos fragmentados y</tspan><tspan x="804.0" y="252.5">devolver la continuidad al hábitat a lo</tspan><tspan x="804.0" y="267.5">largo del cauce</tspan></text>
<line x1="652.0" y1="252.5" x2="654.0" y2="252.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1130.0" y="304.0" width="300.0" height="69.5" rx="7" ry="7" fill="#d7edf0" stroke="#2b8793" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#115c67"><tspan x="1280.0" y="330.5">Mejorar el conocimiento y el</tspan><tspan x="1280.0" y="347.0">seguimiento del estado poblacional</tspan></text>
<line x1="1142.0" y1="304.0" x2="1142.0" y2="252.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1144.0" y="221.0" width="300.0" height="63.0" rx="7" ry="7" fill="#edf7f9" stroke="#83bcc4" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="1294.0" y="237.5">Realizar censos y estudios actualizados</tspan><tspan x="1294.0" y="252.5">para conocer la distribución real y la</tspan><tspan x="1294.0" y="267.5">tendencia poblacional</tspan></text>
<line x1="1142.0" y1="252.5" x2="1144.0" y2="252.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="515.0" y="417.5" width="490.0" height="92.0" rx="11" ry="11" fill="#0f5560" stroke="#0f5560" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff"><tspan x="760.0" y="441.5">Garantizar la conservación y la recuperación</tspan><tspan x="760.0" y="463.5">de las poblaciones de rata de agua (Arvicola</tspan><tspan x="760.0" y="485.5">sapidus) en el río Francia</tspan></text>
<text x="760" y="409.5" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#0f5560">OBJETIVO  CENTRAL · ¿QUÉ QUEREMOS CONSEGUIR?</text>
<rect x="150.0" y="553.5" width="300.0" height="69.5" rx="7" ry="7" fill="#dcefe4" stroke="#2f8a66" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#19624a"><tspan x="300.0" y="571.8">Evitar la extinción local y</tspan><tspan x="300.0" y="588.2">mantener poblaciones viables de</tspan><tspan x="300.0" y="604.8">rata de agua</tspan></text>
<line x1="162.0" y1="623.0" x2="162.0" y2="674.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="164.0" y="643.0" width="300.0" height="63.0" rx="7" ry="7" fill="#eef8f2" stroke="#83bfa2" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#246b50"><tspan x="314.0" y="659.5">Mantener y aumentar el número de</tspan><tspan x="314.0" y="674.5">individuos y de poblaciones</tspan><tspan x="314.0" y="689.5">reproductoras</tspan></text>
<line x1="162.0" y1="674.5" x2="164.0" y2="674.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="640.0" y="553.5" width="300.0" height="69.5" rx="7" ry="7" fill="#dcefe4" stroke="#2f8a66" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#19624a"><tspan x="790.0" y="571.8">Conservar la variabilidad genética</tspan><tspan x="790.0" y="588.2">y restaurar la conectividad</tspan><tspan x="790.0" y="604.8">poblacional</tspan></text>
<line x1="652.0" y1="623.0" x2="652.0" y2="741.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="643.0" width="300.0" height="63.0" rx="7" ry="7" fill="#eef8f2" stroke="#83bfa2" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#246b50"><tspan x="804.0" y="659.5">Favorecer el intercambio genético y</tspan><tspan x="804.0" y="674.5">reducir el riesgo de endogamia en</tspan><tspan x="804.0" y="689.5">poblaciones pequeñas y aisladas</tspan></text>
<line x1="652.0" y1="674.5" x2="654.0" y2="674.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="654.0" y="717.0" width="300.0" height="48.0" rx="7" ry="7" fill="#eef8f2" stroke="#83bfa2" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#246b50"><tspan x="804.0" y="733.5">Mantener la capacidad de adaptación a</tspan><tspan x="804.0" y="748.5">los cambios ambientales</tspan></text>
<line x1="652.0" y1="741.0" x2="654.0" y2="741.0" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1130.0" y="553.5" width="300.0" height="69.5" rx="7" ry="7" fill="#dcefe4" stroke="#2f8a66" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#19624a"><tspan x="1280.0" y="571.8">Preservar las relaciones</tspan><tspan x="1280.0" y="588.2">ecológicas y la funcionalidad del</tspan><tspan x="1280.0" y="604.8">ecosistema ribereño</tspan></text>
<line x1="1142.0" y1="623.0" x2="1142.0" y2="674.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<rect x="1144.0" y="643.0" width="300.0" height="63.0" rx="7" ry="7" fill="#eef8f2" stroke="#83bfa2" stroke-width="1.6"/>
<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#246b50"><tspan x="1294.0" y="659.5">Asegurar la disponibilidad de presa para</tspan><tspan x="1294.0" y="674.5">depredadores autóctonos como la nutria y</tspan><tspan x="1294.0" y="689.5">el turón</tspan></text>
<line x1="1142.0" y1="674.5" x2="1144.0" y2="674.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
<text x="40" y="26" font-family="Lato, Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="2" fill="#2b8793">DEL ÁRBOL DE PROBLEMAS AL ÁRBOL DE OBJETIVOS</text>
<text x="40" y="50" font-family="Lato, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="1" fill="#103b40">ÁRBOL DE OBJETIVOS</text>
<text x="40" y="72" font-family="Lato, Arial, sans-serif" font-size="13.5" fill="#5d6b68">Proyecto RIPARIA-GEN · Conservación de la rata de agua (Arvicola sapidus) en el río Francia — transformación de la situación negativa en una situación deseada y viable</text>
<text x="18" y="230.8" transform="rotate(-90 18 230.8)" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#2b8793">MEDIOS · ¿CÓMO?</text>
<text x="18" y="659.2" transform="rotate(-90 18 659.2)" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#2f8a66">FINES · ¿PARA QUÉ?</text>
<rect x="40" y="798.0" width="16" height="16" rx="3" fill="#d7edf0" stroke="#2b8793" stroke-width="1.6"/>
<text x="63" y="810.0" font-family="Lato, Arial, sans-serif" font-size="12.5" fill="#3b4744">Medios (¿cómo?)</text>
<rect x="240" y="798.0" width="16" height="16" rx="3" fill="#dcefe4" stroke="#2f8a66" stroke-width="1.6"/>
<text x="263" y="810.0" font-family="Lato, Arial, sans-serif" font-size="12.5" fill="#3b4744">Fines (¿para qué?)</text>
<rect x="450" y="798.0" width="16" height="16" rx="3" fill="#0f5560"/>
<text x="473" y="810.0" font-family="Lato, Arial, sans-serif" font-size="12.5" fill="#3b4744">Objetivo central</text>
<text x="1560" y="810.0" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" fill="#8b9693">Redacción y Ejecución de Proyectos (REP) · Grado en Biología · UAM</text>
