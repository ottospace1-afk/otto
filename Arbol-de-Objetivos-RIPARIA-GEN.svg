<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d6b76"><tspan x="804.0" y="222.5">Reconectar los tramos fragmentados y</tspan><tspan x="804.0" y="237.5">devolver la continuidad al hábitat</tspan><tspan x="804.0" y="252.5">ribereño</tspan></text>
<line x1="652.0" y1="237.5" x2="654.0" y2="237.5" stroke="#99a7a6" stroke-width="1.5" stroke-linecap="round"/>
