<text text-anchor="middle" dominant-baseline="middle" font-family="Lato, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#19624a"><tspan x="790.0" y="615.8">Conservar la variabilidad genética</tspan><tspan x="790.0" y="632.2">y restaurar la conectividad</tspan><tspan x="790.0" y="648.8">poblacional</tspan></text>
