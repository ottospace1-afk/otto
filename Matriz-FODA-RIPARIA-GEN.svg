<text x="1384" y="401" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#ffffff" opacity="0.92">externas · desfavorables</text>
<circle cx="791" cy="426.0" r="3" fill="#b2673a"/>
<text x="802" y="430.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">Reinvasión continua del visón americano desde el río Alagón</text>
<circle cx="791" cy="454.0" r="3" fill="#b2673a"/>
<text x="802" y="458.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">Cambio climático: sequías y estiajes que reducen el hábitat</text>
<circle cx="791" cy="482.0" r="3" fill="#b2673a"/>
<text x="802" y="486.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">Presión humana sobre las riberas (ganadería, usos del suelo, azudes)</text>
<circle cx="791" cy="510.0" r="3" fill="#b2673a"/>
<text x="802" y="514.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">Poblaciones ya muy reducidas y aisladas, con riesgo inmediato de extinción</text>
<text x="92" y="34" font-family="Lato, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="1.5" fill="#132a28">MATRIZ FODA</text>
<text x="92" y="58" font-family="Lato, Arial, sans-serif" font-size="13.5" fill="#5d6b68">Proyecto RIPARIA-GEN · Conservación de la rata de agua (Arvicola sapidus) en el río Francia</text>
<text x="412.0" y="128" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="2" fill="#6b7673">FACTORES INTERNOS  ·  DEL PROYECTO</text>
