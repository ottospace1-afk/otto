<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 734" width="1456" height="734"><defs><clipPath id="c0"><rect x="92" y="142" width="640" height="249" rx="11"/></clipPath><clipPath id="c1"><rect x="766" y="142" width="640" height="249" rx="11"/></clipPath><clipPath id="c2"><rect x="92" y="425" width="640" height="249" rx="11"/></clipPath><clipPath id="c3"><rect x="766" y="425" width="640" height="249" rx="11"/></clipPath></defs><rect width="1456" height="734" fill="#fff"/><g clip-path="url(#c0)"><rect x="92" y="142" width="640" height="249" fill="#eef4ea"/><rect x="92" y="142" width="640" height="46" fill="#3f6b38"/></g><rect x="92" y="142" width="640" height="249" rx="11" fill="none" stroke="#3f6b38" stroke-width="1.6"/><text x="114" y="171" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="1" fill="#fff">FORTALEZAS</text><text x="710" y="171" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#fff">internas · favorables</text><circle cx="117" cy="198" r="3" fill="#3f6b38"/><text x="128" y="202" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">Proyecto con objetivos concretos y un área de estudio delimitada</text><circle cx="117" cy="226" r="3" fill="#3f6b38"/><text x="128" y="230" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">Enfoque dual que combina el control de especies invasoras con la conservación de</text><text x="128" y="247" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">fauna autóctona</text><circle cx="117" cy="271" r="3" fill="#3f6b38"/><text x="128" y="275" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">Beneficios adicionales de la restauración de la vegetación ribereña para otras</text><text x="128" y="292" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">especies</text><g clip-path="url(#c1)"><rect x="766" y="142" width="640" height="249" fill="#e4f2f4"/><rect x="766" y="142" width="640" height="46" fill="#2b8793"/></g><rect x="766" y="142" width="640" height="249" rx="11" fill="none" stroke="#2b8793" stroke-width="1.6"/><text x="788" y="171" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="1" fill="#fff">OPORTUNIDADES</text><text x="1384" y="171" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#fff">externas · favorables</text><circle cx="791" cy="198" r="3" fill="#2b8793"/><text x="802" y="202" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">Marco legal favorable a la gestión de especies exóticas invasoras</text><circle cx="791" cy="226" r="3" fill="#2b8793"/><text x="802" y="230" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">Disponibilidad de estudios científicos y experiencia previa sobre el visón americano</text><circle cx="791" cy="254" r="3" fill="#2b8793"/><text x="802" y="258" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">Posibilidad de colaborar con entidades locales y organismos de conservación</text><circle cx="791" cy="282" r="3" fill="#2b8793"/><text x="802" y="286" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">Potencial para adaptar la metodología a otros ríos y especies amenazadas</text><g clip-path="url(#c2)"><rect x="92" y="425" width="640" height="249" fill="#f8f1db"/><rect x="92" y="425" width="640" height="46" fill="#b0892b"/></g><rect x="92" y="425" width="640" height="249" rx="11" fill="none" stroke="#b0892b" stroke-width="1.6"/><text x="114" y="454" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="1" fill="#fff">DEBILIDADES</text><text x="710" y="454" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#fff">internas · desfavorables</text><circle cx="117" cy="481" r="3" fill="#b0892b"/><text x="128" y="485" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">Dificultad técnica para controlar selectivamente al visón americano sin afectar a</text><text x="128" y="502" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">otras especies</text><circle cx="117" cy="526" r="3" fill="#b0892b"/><text x="128" y="530" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">Limitaciones temporales para restaurar el hábitat y evaluar sus resultados en dos</text><text x="128" y="547" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">años</text><circle cx="117" cy="571" r="3" fill="#b0892b"/><text x="128" y="575" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">Información insuficiente sobre la distribución y el estado poblacional actual de la</text><text x="128" y="592" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">rata de agua</text><circle cx="117" cy="616" r="3" fill="#b0892b"/><text x="128" y="620" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">Dificultad para atribuir el declive poblacional exclusivamente a la depredación por</text><text x="128" y="637" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">el visón</text><g clip-path="url(#c3)"><rect x="766" y="425" width="640" height="249" fill="#f8eae1"/><rect x="766" y="425" width="640" height="46" fill="#b2673a"/></g><rect x="766" y="425" width="640" height="249" rx="11" fill="none" stroke="#b2673a" stroke-width="1.6"/><text x="788" y="454" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="1" fill="#fff">AMENAZAS</text><text x="1384" y="454" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#fff">externas · desfavorables</text><circle cx="791" cy="481" r="3" fill="#b2673a"/><text x="802" y="485" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">Recolonización del área por visones procedentes de zonas próximas</text><circle cx="791" cy="509" r="3" fill="#b2673a"/><text x="802" y="513" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">Riesgo de captura accidental de especies autóctonas durante las actuaciones de</text><text x="802" y="530" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">control</text><circle cx="791" cy="554" r="3" fill="#b2673a"/><text x="802" y="558" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">Crecidas, riadas y variaciones estacionales del caudal</text><circle cx="791" cy="582" r="3" fill="#b2673a"/><text x="802" y="586" font-family="Lato, Arial, sans-serif" font-size="13" fill="#79441f">Falta de continuidad futura del control</text><text x="92" y="34" font-family="Lato, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="1.5" fill="#132a28">MATRIZ FODA</text><text x="92" y="58" font-family="Lato, Arial, sans-serif" font-size="13.5" fill="#5d6b68">Proyecto RIPARIA-GEN · Conservación de la rata de agua (Arvicola sapidus) en el río Francia</text><text x="412.0" y="128" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="2" fill="#6b7673">FACTORES INTERNOS  ·  DEL PROYECTO</text><text x="1086.0" y="128" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="2" fill="#6b7673">FACTORES EXTERNOS  ·  DEL ENTORNO</text><text x="34" y="266.5" transform="rotate(-90 34 266.5)" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#3f6b38">FAVORABLES  (+)</text><text x="34" y="549.5" transform="rotate(-90 34 549.5)" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#b2673a">DESFAVORABLES  (−)</text><text x="1406" y="712" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" fill="#8b9693">Redacción y Ejecución de Proyectos (REP) · Grado en Biología · UAM</text></svg>