<text x="788" y="171" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="1" fill="#ffffff">OPORTUNIDADES</text>
<text x="1384" y="171" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#ffffff" opacity="0.92">externas · favorables</text>
<circle cx="791" cy="196.0" r="3" fill="#2b8793"/>
<text x="802" y="200.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">Financiación disponible (fondos LIFE y de biodiversidad); especie catalogada</text>
<text x="802" y="217.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">«vulnerable»</text>
<circle cx="791" cy="241.0" r="3" fill="#2b8793"/>
<text x="802" y="245.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">Auge de la restauración fluvial y la retirada de azudes (Directiva Marco del Agua)</text>
<circle cx="791" cy="269.0" r="3" fill="#2b8793"/>
<text x="802" y="273.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">Colaboración posible con administración, universidad y colectivos locales</text>
<circle cx="791" cy="297.0" r="3" fill="#2b8793"/>
<text x="802" y="301.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#154e57">Valor como especie bandera para divulgación y educación ambiental</text>
