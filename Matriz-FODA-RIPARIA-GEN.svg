<text x="114" y="171" font-family="Lato, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="1" fill="#ffffff">FORTALEZAS</text>
<text x="710" y="171" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#ffffff" opacity="0.92">internas · favorables</text>
<circle cx="117" cy="196.0" r="3" fill="#3f6b38"/>
<text x="128" y="200.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">Proyecto integral en tres frentes: diagnóstico genético, control del visón y</text>
<text x="128" y="217.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">restauración del hábitat</text>
<circle cx="117" cy="241.0" r="3" fill="#3f6b38"/>
<text x="128" y="245.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">Técnicas modernas y no invasivas (ADN ambiental y genética de excrementos)</text>
<circle cx="117" cy="269.0" r="3" fill="#3f6b38"/>
<text x="128" y="273.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">Ámbito completo y abarcable: los 25 km del río Francia, de principio a fin</text>
<circle cx="117" cy="297.0" r="3" fill="#3f6b38"/>
<text x="128" y="301.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#26491f">Especie paraguas: su conservación protege también al desmán, la nutria y el turón</text>
<g clip-path="url(#cl1)">
