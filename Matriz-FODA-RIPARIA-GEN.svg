<text x="710" y="401" text-anchor="end" font-family="Lato, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#ffffff" opacity="0.92">internas · desfavorables</text>
<circle cx="117" cy="426.0" r="3" fill="#b0892b"/>
<text x="128" y="430.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">Elevado coste y fuerte dependencia de financiación externa</text>
<circle cx="117" cy="454.0" r="3" fill="#b0892b"/>
<text x="128" y="458.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">Necesita personal especializado y un seguimiento continuo</text>
<circle cx="117" cy="482.0" r="3" fill="#b0892b"/>
<text x="128" y="486.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">Se parte de pocos datos sobre la población actual de la especie</text>
<circle cx="117" cy="510.0" r="3" fill="#b0892b"/>
<text x="128" y="514.0" font-family="Lato, Arial, sans-serif" font-size="13" fill="#6c5112">Plazo de 2 años quizá corto para demostrar resultados poblacionales</text>
